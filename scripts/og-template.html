<!doctype html>
<!--
  Source for public/og.png (1200x630 social card).
  Regenerate after a brand change:

  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
    --headless=new --disable-gpu --hide-scrollbars \
    --window-size=1200,630 --virtual-time-budget=9000 \
    --screenshot=public/og.png scripts/og-template.html
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Infralyte social card</title>
<link rel="stylesheet" href="https://fonts.bunny.net/css?family=figtree:500,600|fraunces:460|ibm-plex-mono:500">
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    position: relative;
    background: #080907;
    color: #f6f2e8;
    font-family: "Figtree", sans-serif;
  }
  .glow-a, .glow-b {
    position: absolute;
    border-radius: 50%;
    filter: blur(90px);
  }
  .glow-a {
    top: -180px; right: -120px; width: 620px; height: 480px;
    background: radial-gradient(circle at 50% 50%, rgba(220, 187, 116, 0.34), transparent 68%);
  }
  .glow-b {
    bottom: -220px; left: -140px; width: 520px; height: 420px;
    background: radial-gradient(circle at 50% 50%, rgba(138, 165, 141, 0.16), transparent 68%);
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(to right, rgba(246, 242, 232, 0.055) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(246, 242, 232, 0.055) 1px, transparent 1px);
    background-size: 74px 74px;
    mask-image: radial-gradient(ellipse 80% 70% at 30% 30%, #000 10%, transparent 72%);
    -webkit-mask-image: radial-gradient(ellipse 80% 70% at 30% 30%, #000 10%, transparent 72%);
  }
  .inner {
    position: relative;
    height: 100%;
    padding: 72px 80px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .mark { display: flex; align-items: center; gap: 16px; font-size: 28px; font-weight: 600; letter-spacing: -0.03em; }
  .mark svg { width: 44px; height: 44px; border-radius: 11px; }
  h1 {
    max-width: 960px;
    font-family: "Fraunces", serif;
    font-weight: 460;
    font-size: 88px;
    line-height: 1.02;
    letter-spacing: -0.035em;
  }
  h1 em { font-style: normal; color: #dcbb74; }
  .foot {
    display: flex; align-items: center; justify-content: space-between;
    padding-top: 30px;
    border-top: 1px solid rgba(246, 242, 232, 0.1);
    color: #a8a196;
    font-family: "IBM Plex Mono", monospace;
    font-size: 18px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .foot .url { color: #dcbb74; }
</style>
</head>
<body>
  <span class="glow-a"></span>
  <span class="glow-b"></span>
  <span class="grid"></span>
  <div class="inner">
    <div class="mark">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <rect width="64" height="64" rx="12" fill="#d7b56d"/>
        <path fill="#0a0b09" d="M18 13h28v6.2H37.2V44.8H46V51H18v-6.2h8.8V19.2H18z"/>
      </svg>
      Infralyte
    </div>
    <h1>AI, built into the work you <em>already run.</em></h1>
    <div class="foot">
      <span>Frontier when they fit · Private when data cannot leave</span>
      <span class="url">infralyte.in</span>
    </div>
  </div>
</body>
</html>
